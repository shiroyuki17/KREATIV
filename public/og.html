<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:
      radial-gradient(900px 620px at 18% 22%, rgba(123,57,252,.55), transparent 62%),
      linear-gradient(135deg,#17112a 0%,#221a3a 55%,#2b2344 100%);
    font-family:"Segoe UI",system-ui,sans-serif;
    color:#edeef0; padding:88px 92px; display:flex; flex-direction:column; justify-content:center;
  }
  .mark{font-size:96px;font-weight:800;letter-spacing:-2px;line-height:1}
  .mark span{color:#a374fd}
  .tag{margin-top:26px;font-size:38px;font-weight:600;color:#d7d9dd;letter-spacing:-.4px}
  .sub{margin-top:18px;font-size:25px;font-weight:400;color:#9aa0a8}
  .rule{margin-top:44px;width:210px;height:9px;border-radius:5px;background:linear-gradient(90deg,#7b39fc,#b06bfb)}
</style></head><body>
  <div class="mark">KRE<span>ATIV</span></div>
  <div class="tag">Escrow-protected freelance work</div>
  <div class="sub">Post a brief · Hire vetted talent · Pay milestone by milestone</div>
  <div class="rule"></div>
</body></html>
