# Render Blueprint — эрх бүхий account холбож, "New +" → "Blueprint" сонгоод
# энэ repo-г заавал л дараагийн алхам үлдэнэ (би Render account үүсгэж
# чадахгүй тул энэ файл л бэлдэж өгч чадах хэсэг). Дараа нь:
#   1. Render dashboard → New → Blueprint → энэ GitHub repo-г сонгох
#   2. kreativ-backend service-д GOOGLE_CLIENT_ID/SECRET/REDIRECT_URI-г
#      (хэрэв бодит Google OAuth ашиглах бол) гараар бөглөх
#   3. kreativ-backend deploy дууссаны дараа Shell дээр:
#      npx prisma migrate deploy && npm run seed
#   4. kreativ-frontend-ийн VITE_API_URL-ийг kreativ-backend-ийн бодит
#      URL-ээр солиод дахин deploy хийх (эхний deploy дээр backend URL
#      мэдэгдэхгүй тул placeholder-оор эхэлнэ)
databases:
  - name: kreativ-pg
    plan: free
    databaseName: kreativ_db
    user: kreativ

services:
  - type: web
    name: kreativ-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kreativ-pg
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: "4100"
      - key: NODE_ENV
        value: production
      # Цагийн бүртгэлийн "өдөр" аль бүсээр тоологдохыг тодорхойлно. Гэрээ
      # эхлэхэд тоолуур автоматаар асч, өдөр бүр локал шөнө дунд таслагдана —
      # Render нь UTC-ээр ажилладаг тул үүнгүйгээр UB-ийн орой 08:00 цагт
      # тасалж, нэг ажлын өдрийг хоёр хувааж бүртгэнэ.
      - key: TIME_ZONE
        value: Asia/Ulaanbaatar
      # ⚠️ Контейнер асах бүрд seed ажилладаг. NODE_ENV=production үед
      # демо акаунтууд (бүгд "password123" нууц үгтэй) ОГТ үүсэхгүй —
      # энэ файлууд нийтийн repo-д байгаа тул тэдгээр нь нээлттэй хаалга
      # болох байсан.
      #
      # Админ акаунт зөвхөн ДООРХ ХОЁУЛАНГ нь өгсөн үед үүснэ. Хүчтэй,
      # санамсаргүй нууц үг ашиглана уу — үүнийг өөр хаана ч бүү давтана.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Жинхэнэ QPay мерчант эрх ирвэл эдгээрийг бөглөнө — байхгүй үед
      # payment.routes.js демо горим руугаа автоматаар унана (доогуур харна уу).
      - key: QPAY_BASE_URL
        sync: false
      - key: QPAY_USERNAME
        sync: false
      - key: QPAY_PASSWORD
        sync: false
      - key: QPAY_INVOICE_CODE
        sync: false
      - key: QPAY_CALLBACK_URL
        sync: false
      # Жинхэнэ LLM холболт идэвхжүүлэх түлхүүр — байхгүй үед ChatWidget.jsx
      # локал rule-based хариулт руугаа автоматаар унана.
      - key: ANTHROPIC_API_KEY
        sync: false
      # ⚠️ Render-ийн web service-ийн файл систем нь ТҮР ЗУУРЫНХ: deploy
      # эсвэл restart болгонд backend/uploads/ доторх бүх аватар, чатын
      # хавсралт устана. Эдгээрийг бөглөж объект хадгалалт (S3/R2) руу
      # шилжүүлэх нь production-д ЗААВАЛ шаардлагатай. Хоосон үлдээвэл код
      # диск рүүгээ унаж ажиллаад, файлууд чимээгүй алга болно.
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      # ── Stripe ── escrow deposit + Pro захиалга. STRIPE_WEBHOOK_SECRET нь
      # Stripe Dashboard → Webhooks дээр энэ service-ийн бодит URL
      # (https://<backend>/webhooks/stripe) бүртгэсний дараа гарна.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: PAYMENT_PROVIDER
        value: auto
      # ⚠️ Демо төлбөр нь мөнгөгүйгээр үлдэгдэл үүсгэдэг тул production-д
      # хаалттай. Зориуд асаах бол л "true" болгоно.
      - key: ALLOW_DEMO_PAYMENTS
        value: "false"
      # ── Gemini ── prompt-оор ажил хайх. Байхгүй бол түлхүүр үгийн
      # хайлт руугаа унана (алдаа өгөхгүй).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_SEARCH_DAILY_LIMIT
        value: "40"

  - type: web
    name: kreativ-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      # ── TURN ── чат доторх дуудлага. Хоосон бол STUN-only: хатуу NAT /
      # корпорацийн firewall / мобайл CGNAT дор дуудлага холбогдохгүй.
      # ⚠️ VITE_ угтвартай утга bundle дотор ил орно — хугацаатай
      # (ephemeral) credential ашиглана уу.
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
